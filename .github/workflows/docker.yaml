
name: docker
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  docker:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          image: tonistiigi/binfmt:qemu-v7.0.0-28

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure image tag
        id: image_tag
        run: |
          echo "image_tag=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Write image summary
        run: |
          {
            echo "## Docker image"
            echo
            echo "- Registry: \`greptime-registry.cn-hangzhou.cr.aliyuncs.com\`"
            echo "- Tag: \`${{ env.image_tag }}\`"
            echo "- Image: \`greptime-registry.cn-hangzhou.cr.aliyuncs.com/tools/metrics-loader:${{ env.image_tag }}\`"
            echo "- Published: \`${{ github.event_name == 'push' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: login to aliyun
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: greptime-registry.cn-hangzhou.cr.aliyuncs.com
          username: ${{ secrets.GREPTIME_REGISTRY_USERNAME }}
          password: ${{ secrets.GREPTIME_REGISTRY_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            greptime-registry.cn-hangzhou.cr.aliyuncs.com/tools/metrics-loader:${{ env.image_tag }}
