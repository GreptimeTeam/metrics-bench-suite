apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "metrics-loader.jobName" . }}
  labels:
    {{- include "metrics-loader.labels" . | nindent 4 }}
  {{- with .Values.job.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  completions: {{ .Values.replicaCount }}
  parallelism: {{ .Values.replicaCount }}
  completionMode: Indexed
  backoffLimit: {{ .Values.job.backoffLimit }}
  {{- if ne .Values.job.ttlSecondsAfterFinished nil }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "metrics-loader.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "metrics-loader.serviceAccountName" . }}
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: sample-loader
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sample_loader"]
          args:
            - --config
            - {{ required "sampleLoader.config is required" .Values.sampleLoader.config | quote }}
            {{- if .Values.sampleLoader.remoteWriteUrl }}
            - --remote-write-url
            - {{ .Values.sampleLoader.remoteWriteUrl | quote }}
            {{- else if not .Values.sampleLoader.dryRun }}
            {{- fail "sampleLoader.remoteWriteUrl is required unless sampleLoader.dryRun is true" }}
            {{- end }}
            {{- if and (eq .Values.sampleLoader.protocol "otlp") (ne .Values.sampleLoader.remoteWriteVersion "v1") }}
            {{- fail "sampleLoader.remoteWriteVersion must be v1 when sampleLoader.protocol is otlp" }}
            {{- end }}
            - --remote-write-version
            - {{ .Values.sampleLoader.remoteWriteVersion | quote }}
            {{- if and .Values.basicAuth.existingSecret (or .Values.sampleLoader.username .Values.sampleLoader.password) }}
            {{- fail "basicAuth.existingSecret cannot be combined with sampleLoader.username or sampleLoader.password" }}
            {{- end }}
            {{- if .Values.basicAuth.existingSecret }}
            - --username
            - $(BASIC_AUTH_USERNAME)
            - --password
            - $(BASIC_AUTH_PASSWORD)
            {{- else if or .Values.sampleLoader.username .Values.sampleLoader.password }}
            {{- if not (and .Values.sampleLoader.username .Values.sampleLoader.password) }}
            {{- fail "sampleLoader.username and sampleLoader.password must be provided together" }}
            {{- end }}
            - --username
            - {{ .Values.sampleLoader.username | quote }}
            - --password
            - {{ .Values.sampleLoader.password | quote }}
            {{- end }}
            - --start-date
            - {{ .Values.sampleLoader.startDate | quote }}
            - --end-date
            - {{ .Values.sampleLoader.endDate | quote }}
            - --interval
            - {{ .Values.sampleLoader.interval | quote }}
            - --max-samples
            - {{ .Values.sampleLoader.maxSamples | quote }}
            - --tick-interval
            - {{ .Values.sampleLoader.tickInterval | quote }}
            - --workers
            - {{ .Values.sampleLoader.workers | quote }}
            - --replica
            {{- if .Values.sampleLoader.replicaFromJobCompletionIndex }}
            - $(REPLICA_INDEX)
            {{- else }}
            - {{ .Values.sampleLoader.replica | quote }}
            {{- end }}
            {{- if .Values.sampleLoader.infinite }}
            - --infinite
            {{- end }}
            {{- if .Values.sampleLoader.duration }}
            {{- if .Values.sampleLoader.infinite }}
            {{- fail "sampleLoader.duration and sampleLoader.infinite cannot be used together" }}
            {{- end }}
            - --duration
            - {{ .Values.sampleLoader.duration | quote }}
            {{- end }}
            - --table-pick-count
            {{- if and (eq (len .Values.sampleLoader.tablePickCount) 20) (gt .Values.sampleLoader.tablePickCount "18446744073709551615") }}
            {{- fail "sampleLoader.tablePickCount must not exceed 18446744073709551615" }}
            {{- end }}
            - {{ .Values.sampleLoader.tablePickCount | quote }}
            {{- if .Values.sampleLoader.dryRun }}
            - --dry-run
            {{- end }}
            - --churn-rate
            - {{ .Values.sampleLoader.churnRate | quote }}
            - --churn-interval
            - {{ .Values.sampleLoader.churnInterval | quote }}
            - --protocol
            - {{ .Values.sampleLoader.protocol | quote }}
          {{- if or .Values.sampleLoader.replicaFromJobCompletionIndex .Values.basicAuth.existingSecret }}
          env:
            {{- if .Values.sampleLoader.replicaFromJobCompletionIndex }}
            - name: REPLICA_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            {{- end }}
            {{- if .Values.basicAuth.existingSecret }}
            - name: BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.basicAuth.existingSecret | quote }}
                  key: {{ .Values.basicAuth.usernameKey | quote }}
            - name: BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.basicAuth.existingSecret | quote }}
                  key: {{ .Values.basicAuth.passwordKey | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
